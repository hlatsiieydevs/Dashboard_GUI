services:
  dashboard:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "12345:3000"
    env_file:
      - .env
    volumes:
      - ./app/server:/app/server
      - ./certs:/certs:ro
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      # If using a local service account JSON file, map it so the container can read it:
      # - ./service-account.json:/app/service-account.json:ro
    restart: unless-stopped
